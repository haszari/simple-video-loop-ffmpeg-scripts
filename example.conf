# Example settings file for audio-loop-video.sh
# Format: one option per line, value on the same line. '#' starts a comment.
# Convention and flag docs: README.md → audio-loop-video.sh (Config files,
# Colour effects, Encoder settings). Template: cp example.conf show.conf

# --- Encoder settings (see README for codec/CRF guidance) ---
--codec libx264
--crf 23

# --- Colour LFO (see README: Colour effects) ---
--bpm 128
--bars 64
--color hue,sat:0.1:32

# --- Output ---
--output renders/example-final.mp4

# --- Inputs (bare lines work too) ---
--audio music.mp3
--video bg.mp4
